name: CI Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron:  '30 5 * * *'

permissions:
  contents: read

jobs:
  ci-python:
    strategy:
      fail-fast: false
      matrix:
        packageDirectory: ["ml_wrappers"]
        operatingSystem: [ubuntu-latest, macos-latest, windows-latest]
        pythonVersion: ['3.10', '3.11', '3.12', '3.13', '3.14']
        openaiVersion: ['0.28.1', 'openai-latest']
        exclude:
          - openaiVersion: '0.28.1'
            pythonVersion: '3.12'
          - openaiVersion: '0.28.1'
            pythonVersion: '3.10'
          - openaiVersion: '0.28.1'
            pythonVersion: '3.13'
          - openaiVersion: '0.28.1'
            pythonVersion: '3.14'
          - openaiVersion: '0.28.1'
            operatingSystem: 'macos-latest'
          - openaiVersion: '0.28.1'
            operatingSystem: 'windows-latest'

    runs-on: ${{ matrix.operatingSystem }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
      with:
        auto-update-conda: true
        python-version: ${{ matrix.pythonVersion }}
        channels: conda-forge

    - if: ${{ matrix.operatingSystem == 'macos-latest' }}
      name: Use Homebrew to install libomp on MacOS
      shell: bash -l {0}
      run: |
        brew install libomp

    - if: ${{ matrix.operatingSystem == 'windows-latest' && (matrix.pythonVersion == '3.10' || matrix.pythonVersion == '3.11') }}
      name: Install pytorch on Windows for Python 3.10 and 3.11
      shell: bash -l {0}
      run: |
        conda install --yes --quiet pytorch torchvision cpuonly "pillow>=10" -c pytorch -c conda-forge --strict-channel-priority

    - if: ${{ matrix.operatingSystem == 'ubuntu-latest' && (matrix.pythonVersion == '3.10' || matrix.pythonVersion == '3.11') }}
      name: Install pytorch on Ubuntu for Python 3.10 and 3.11
      shell: bash -l {0}
      run: |
        conda install --yes --quiet pytorch torchvision cpuonly -c pytorch -c conda-forge --strict-channel-priority

    - if: ${{ matrix.operatingSystem == 'macos-latest' && (matrix.pythonVersion == '3.10' || matrix.pythonVersion == '3.11') }}
      name: Install pytorch on macOS for Python 3.10 and 3.11
      shell: bash -l {0}
      run: |
        conda install --yes --quiet pytorch torchvision -c pytorch -c conda-forge

    - if: ${{ matrix.operatingSystem != 'macos-latest' && matrix.pythonVersion != '3.10' && matrix.pythonVersion != '3.11' }}
      name: Install CPU pytorch for Python 3.12 and newer
      shell: bash -l {0}
      run: |
        python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

    - if: ${{ matrix.operatingSystem == 'macos-latest' && matrix.pythonVersion != '3.10' && matrix.pythonVersion != '3.11' }}
      name: Install macOS pytorch for Python 3.12 and newer
      shell: bash -l {0}
      run: |
        python -m pip install torch torchvision

    - if: ${{ matrix.operatingSystem == 'macos-latest' }}
      name: Install lightgbm from conda on MacOS
      shell: bash -l {0}
      run: |
        conda install --yes "lightgbm>=4.5.0" -c conda-forge

    - if: ${{ matrix.pythonVersion != '3.14' }}
      name: Install backwards-compatible tf-keras for transformers
      shell: bash -l {0}
      run: |
        pip install tf-keras

    - name: Install package
      shell: bash -l {0}
      run: |
        pip install -e ./python

    - name: Install dev dependencies
      shell: bash -l {0}
      run: |
        pip install -r requirements-dev.txt

    - name: Install test dependencies
      shell: bash -l {0}
      run: |
        pip install -r requirements-test.txt

    - name: Upgrade matplotlib for NumPy 2.x compatibility
      shell: bash -l {0}
      run: |
        pip install --upgrade "matplotlib>=3.9.0"

    - if: ${{ matrix.openaiVersion != 'openai-latest' }}
      name: Install openai version ${{ matrix.openaiVersion }}
      shell: bash -l {0}
      run: |
        pip install openai==${{ matrix.openaiVersion }}

    - name: Verify resolved NumPy and Captum versions
      shell: bash -l {0}
      run: |
        python -c "import numpy; from importlib.metadata import version; assert int(numpy.__version__.split('.')[0]) == 2, numpy.__version__; assert tuple(map(int, version('captum').split('.')[:2])) >= (0, 9), version('captum')"

    - name: Verify dependency consistency
      shell: bash -l {0}
      run: |
        python -m pip check

    - if: ${{ matrix.operatingSystem == 'macos-latest' }}
      name: Set macOS environment variables to prevent hangs
      shell: bash -l {0}
      run: |
        # GRPC_POLL_STRATEGY=poll - Forces gRPC to use the poll strategy instead of
        # platform-specific mechanisms that can deadlock on macOS
        echo "GRPC_POLL_STRATEGY=poll" >> $GITHUB_ENV
        # TF_ENABLE_ONEDNN_OPTS=0 - Disables oneDNN optimizations that can cause issues on macOS
        echo "TF_ENABLE_ONEDNN_OPTS=0" >> $GITHUB_ENV
        # OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES - Disables the Objective-C fork safety check
        # that can cause hangs when Python multiprocessing interacts with certain libraries
        echo "OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES" >> $GITHUB_ENV

    - name: Test with pytest
      shell: bash -l {0}
      run: |
        pytest ./tests/main -s -v --durations=10 --cov='ml_wrappers' --cov-report=xml --cov-report=html

    - name: Upload code coverage results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ matrix.packageDirectory }}-${{ matrix.openaiVersion }}-${{ matrix.pythonVersion }}-${{ matrix.operatingSystem }}-code-coverage-results
        path: htmlcov
      # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}

    - if: ${{ (matrix.operatingSystem == 'windows-latest') && (matrix.pythonVersion == '3.11') }}
      name: Upload to codecov
      id: codecovupload1
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: .
        env_vars: OS,PYTHON
        fail_ci_if_error: false
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        verbose: true

    - if: ${{ (steps.codecovupload1.outcome == 'failure') && (matrix.pythonVersion == '3.11') && (matrix.operatingSystem == 'windows-latest') }}
      name: Retry upload to codecov
      id: codecovupload2
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: .
        env_vars: OS,PYTHON
        fail_ci_if_error: false
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        verbose: true

    - name: Set codecov status
      if: ${{ (matrix.pythonVersion == '3.11') && (matrix.operatingSystem == 'windows-latest') }}
      shell: bash
      run: |
        if ${{ (steps.codecovupload1.outcome == 'success') || (steps.codecovupload2.outcome == 'success') }} ; then
          echo fine
        else
          exit 1
        fi

  ci-numpy-compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - numpyVersion: '1.26.4'
            dependencySet: latest
          - numpyVersion: '2.0.2'
            dependencySet: latest
          - numpyVersion: '2.0.2'
            dependencySet: minimum
          - numpyVersion: '2.2.6'
            dependencySet: latest

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Install ${{ matrix.dependencySet }} dependencies with NumPy ${{ matrix.numpyVersion }}
      run: |
        python -m pip install --upgrade pip
        constraint_file="${{ github.workspace }}/numpy-constraints.txt"
        echo "numpy==${{ matrix.numpyVersion }}" > "$constraint_file"
        if [[ "${{ matrix.dependencySet }}" == "minimum" ]]; then
          cat >> "$constraint_file" <<EOF
        pandas==2.2.2
        scipy==1.13.0
        scikit-learn==1.4.2
        EOF
        else
          echo "pandas<3" >> "$constraint_file"
        fi
        PIP_CONSTRAINT="$constraint_file" pip install \
          "numpy==${{ matrix.numpyVersion }}" -e ./python pytest

    - name: Verify dependency consistency
      run: |
        python -c "import numpy; assert numpy.__version__ == '${{ matrix.numpyVersion }}'"
        pip check

    - name: Run NumPy compatibility test
      run: |
        pytest numpy_compatibility_tests -v
